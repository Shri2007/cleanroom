[project]
name = "cleanroom"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "openai>=3.46.0",
    "opencv-python>=5.0.0.93",
    "pyobjc-framework-quartz>=13.0",
    "python-dotenv>=1.2.4",
    "uagents>=0.26.1",
    "uvicorn>=0.54.0",
]

[tool.uv]
# cosmpy (pulled in by uagents) pins pynacl==1.6.0, which has known vulnerabilities
# (PYSEC-2026-1448, PYSEC-2026-3002; fixed in 1.6.2). Override until cosmpy relaxes the pin.
override-dependencies = ["pynacl>=1.6.2"]
