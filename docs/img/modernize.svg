<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" width="1040" height="420" role="img" aria-label="modernize">
<style>
  .bg{fill:#f8fafc} .fg{fill:#172033} .t{font:650 20px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172033}
  .l{font:600 14px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172033}
  .s{font:400 12px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#5b6475}
  .m{font:500 13px ui-monospace,Menlo,monospace;fill:#172033;white-space:pre}
  .node{stroke:#64748b;stroke-width:1}
  .neutral{fill:#e2e8f0} .input{fill:#bfdbfe} .process{fill:#c7d2fe} .storage{fill:#99f6e4}
  .external{fill:#fde68a} .risk{fill:#fecaca} .good{fill:#bbf7d0}
  .edge{stroke:#64748b;stroke-width:1.5;fill:none} .dash{stroke-dasharray:5 4}
  .zone{fill:none;stroke:#64748b;stroke-width:1;stroke-dasharray:6 5;opacity:.8}
  .arrow{fill:#64748b}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0f172a} .fg,.t,.l,.m{fill:#e5e7eb} .s{fill:#a3adbd}
    .node{stroke:#94a3b8} .edge{stroke:#94a3b8} .zone{stroke:#94a3b8} .arrow{fill:#94a3b8}
    .neutral{fill:#334155} .input{fill:#1d4ed8} .process{fill:#4338ca} .storage{fill:#0f766e}
    .external{fill:#92400e} .risk{fill:#991b1b} .good{fill:#166534}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path class="arrow" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="1040" height="420" rx="18"/><path class="edge" d="M242,156.0 L292,156.0" marker-end="url(#a)"/><path class="edge" d="M502,156.0 L552,156.0" marker-end="url(#a)"/><path class="edge" d="M137.0,202 L137.0,296 L292,296" marker-end="url(#a)"/><path class="edge" d="M657.0,202 L657.0,250" marker-end="url(#a)"/><path class="edge" d="M762,296.0 C790,296 790,226 812,226.0" marker-end="url(#a)"/><text class="t" x="28" y="40">Modernize: same behavior, better code</text><text class="s" x="28" y="62">Legacy code nobody dares touch, rewritten and proven identical on every observed press.</text><rect class="node neutral" x="32" y="110" width="210" height="92" rx="12"/><text class="l" x="137.0" y="144.0" text-anchor="middle">Legacy copy</text><text class="s" x="137.0" y="164.0" text-anchor="middle">calc_v7.js</text><text class="s" x="137.0" y="181.0" text-anchor="middle">252 lines</text><rect class="node process" x="292" y="110" width="210" height="92" rx="12"/><text class="l" x="397.0" y="144.0" text-anchor="middle">Meta rewrite</text><text class="s" x="397.0" y="164.0" text-anchor="middle">small pure functions</text><text class="s" x="397.0" y="181.0" text-anchor="middle">aim for &lt; 75% length</text><rect class="node good" x="552" y="110" width="210" height="92" rx="12"/><text class="l" x="657.0" y="144.0" text-anchor="middle">Modern copy</text><text class="s" x="657.0" y="164.0" text-anchor="middle">calc_v19.js</text><text class="s" x="657.0" y="181.0" text-anchor="middle">115 lines</text><rect class="node risk" x="292" y="250" width="470" height="92" rx="12"/><text class="l" x="527.0" y="292.5" text-anchor="middle">Replay every observed press on both</text><text class="s" x="527.0" y="312.5" text-anchor="middle">Node sandbox, same trace, train + held-out</text><rect class="node neutral" x="812" y="180" width="200" height="92" rx="12"/><text class="l" x="912.0" y="214.0" text-anchor="middle">Identical?</text><text class="s" x="912.0" y="234.0" text-anchor="middle">same output, same misses</text><text class="s" x="912.0" y="251.0" text-anchor="middle">yes → keep · no → reject</text><text class="s" x="32" y="390" text-anchor="start">Measured: 252 → 115 lines, identical on all 19 observed presses (including the old copy's mistakes), ~13 s.</text></svg>