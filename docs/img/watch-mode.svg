<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" width="1080" height="470" role="img" aria-label="watch-mode">
<style>
  .bg{fill:#f8fafc} .fg{fill:#172033} .t{font:650 20px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172033}
  .l{font:600 14px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172033}
  .s{font:400 12px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#5b6475}
  .m{font:500 13px ui-monospace,Menlo,monospace;fill:#172033;white-space:pre}
  .node{stroke:#64748b;stroke-width:1}
  .neutral{fill:#e2e8f0} .input{fill:#bfdbfe} .process{fill:#c7d2fe} .storage{fill:#99f6e4}
  .external{fill:#fde68a} .risk{fill:#fecaca} .good{fill:#bbf7d0}
  .edge{stroke:#64748b;stroke-width:1.5;fill:none} .dash{stroke-dasharray:5 4}
  .zone{fill:none;stroke:#64748b;stroke-width:1;stroke-dasharray:6 5;opacity:.8}
  .arrow{fill:#64748b}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0f172a} .fg,.t,.l,.m{fill:#e5e7eb} .s{fill:#a3adbd}
    .node{stroke:#94a3b8} .edge{stroke:#94a3b8} .zone{stroke:#94a3b8} .arrow{fill:#94a3b8}
    .neutral{fill:#334155} .input{fill:#1d4ed8} .process{fill:#4338ca} .storage{fill:#0f766e}
    .external{fill:#92400e} .risk{fill:#991b1b} .good{fill:#166534}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path class="arrow" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="1080" height="470" rx="18"/><path class="edge" d="M212,146.0 L242,146.0" marker-end="url(#a)"/><path class="edge" d="M422,146.0 L452,146.0" marker-end="url(#a)"/><path class="edge" d="M632,146.0 L662,146.0" marker-end="url(#a)"/><path class="edge" d="M842,146.0 L872,146.0" marker-end="url(#a)"/><path class="edge" d="M962.0,192 L962.0,250" marker-end="url(#a)"/><path class="edge" d="M857.0,342 L857.0,360" marker-end="url(#a)"/><path class="edge dash" d="M622,296 L662,296"/><text class="t" x="28" y="40">Watch mode: it works out which key you pressed</text><text class="s" x="28" y="62">Nobody tells it the keys. It screenshots the phone and infers each press from what changed.</text><rect class="node input" x="32" y="100" width="180" height="92" rx="12"/><text class="l" x="122.0" y="134.0" text-anchor="middle">Screenshot</text><text class="s" x="122.0" y="154.0" text-anchor="middle">every 0.12 s</text><text class="s" x="122.0" y="171.0" text-anchor="middle">phone window only</text><rect class="node neutral" x="242" y="100" width="180" height="92" rx="12"/><text class="l" x="332.0" y="134.0" text-anchor="middle">Changed?</text><text class="s" x="332.0" y="154.0" text-anchor="middle">&gt;0.2% of pixels moved</text><text class="s" x="332.0" y="171.0" text-anchor="middle">(clock bar ignored)</text><rect class="node neutral" x="452" y="100" width="180" height="92" rx="12"/><text class="l" x="542.0" y="134.0" text-anchor="middle">Settled?</text><text class="s" x="542.0" y="154.0" text-anchor="middle">3 identical frames</text><text class="s" x="542.0" y="171.0" text-anchor="middle">press glow has faded</text><rect class="node storage" x="662" y="100" width="180" height="92" rx="12"/><text class="l" x="752.0" y="134.0" text-anchor="middle">Queue</text><text class="s" x="752.0" y="154.0" text-anchor="middle">never waits for</text><text class="s" x="752.0" y="171.0" text-anchor="middle">the reader</text><rect class="node process" x="872" y="100" width="180" height="92" rx="12"/><text class="l" x="962.0" y="134.0" text-anchor="middle">Read in parallel</text><text class="s" x="962.0" y="154.0" text-anchor="middle">Meta reader</text><text class="s" x="962.0" y="171.0" text-anchor="middle">logged in screen order</text><rect class="node process" x="662" y="250" width="390" height="92" rx="12"/><text class="l" x="857.0" y="284.0" text-anchor="middle">Infer the key</text><text class="s" x="857.0" y="304.0" text-anchor="middle">rules first; if unsure, ask the brain (text only)</text><text class="s" x="857.0" y="321.0" text-anchor="middle">same screen as before → not a key (no duplicates)</text><rect class="node neutral" x="32" y="250" width="590" height="170" rx="12"/><text class="l" x="56" y="280">Examples: screen before → after ⇒ inferred key</text><text class="m" x="56" y="310" text-anchor="start">           5  →  50              ⇒  0</text><text class="m" x="56" y="332" text-anchor="start">          50  →  50  [+ lit]     ⇒  +</text><text class="m" x="56" y="354" text-anchor="start"> 50  [+ lit]  →  50+1            ⇒  1</text><text class="m" x="56" y="376" text-anchor="start">      50+10%  →  55  (50+10%)    ⇒  =</text><text class="m" x="56" y="398" text-anchor="start">          55  →  0  [AC]         ⇒  AC</text><rect class="node storage" x="662" y="360" width="390" height="60" rx="12"/><text class="l" x="857.0" y="386.5" text-anchor="middle">Trace line</text><text class="s" x="857.0" y="406.5" text-anchor="middle">same format as a typed tap</text><text class="s" x="32" y="440" text-anchor="start">Honest limit: a press that changes nothing on screen (a second '+', a second '.') cannot be observed, so it is not logged.</text></svg>