<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="fix-loop">
<style>
  .bg{fill:#f8fafc} .fg{fill:#172033} .t{font:650 20px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172033}
  .l{font:600 14px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172033}
  .s{font:400 12px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#5b6475}
  .m{font:500 13px ui-monospace,Menlo,monospace;fill:#172033;white-space:pre}
  .node{stroke:#64748b;stroke-width:1}
  .neutral{fill:#e2e8f0} .input{fill:#bfdbfe} .process{fill:#c7d2fe} .storage{fill:#99f6e4}
  .external{fill:#fde68a} .risk{fill:#fecaca} .good{fill:#bbf7d0}
  .edge{stroke:#64748b;stroke-width:1.5;fill:none} .dash{stroke-dasharray:5 4}
  .zone{fill:none;stroke:#64748b;stroke-width:1;stroke-dasharray:6 5;opacity:.8}
  .arrow{fill:#64748b}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0f172a} .fg,.t,.l,.m{fill:#e5e7eb} .s{fill:#a3adbd}
    .node{stroke:#94a3b8} .edge{stroke:#94a3b8} .zone{stroke:#94a3b8} .arrow{fill:#94a3b8}
    .neutral{fill:#334155} .input{fill:#1d4ed8} .process{fill:#4338ca} .storage{fill:#0f766e}
    .external{fill:#92400e} .risk{fill:#991b1b} .good{fill:#166534}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path class="arrow" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="1000" height="470" rx="18"/><path class="edge" d="M230,152.0 L280,152.0" marker-end="url(#a)"/><path class="edge" d="M470,152.0 L520,152.0" marker-end="url(#a)"/><path class="edge" d="M710,152.0 L760,152.0" marker-end="url(#a)"/><path class="edge" d="M860.0,194 L860.0,260" marker-end="url(#a)"/><path class="edge" d="M760,302.0 L650,302.0" marker-end="url(#a)"/><text class="s" x="705" y="292" text-anchor="middle">next round</text><path class="edge" d="M525.0,260 C525,220 860,220 800,194" marker-end="url(#a)"/><path class="edge dash" d="M400,324 L340,340" marker-end="url(#a)"/><text class="s" x="370" y="352" text-anchor="middle">done</text><text class="t" x="28" y="40">The fix loop</text><text class="s" x="28" y="62">v1 sees only the first ~10 presses, so the climb is honest. Every version is saved; only improvements are kept.</text><rect class="node storage" x="40" y="110" width="190" height="84" rx="12"/><text class="l" x="135.0" y="140.0" text-anchor="middle">Evidence</text><text class="s" x="135.0" y="160.0" text-anchor="middle">trace, split by test</text><text class="s" x="135.0" y="177.0" text-anchor="middle">70% train · 30% held-out</text><rect class="node process" x="280" y="110" width="190" height="84" rx="12"/><text class="l" x="375.0" y="140.0" text-anchor="middle">find_rules</text><text class="s" x="375.0" y="160.0" text-anchor="middle">seen vs guessed</text><text class="s" x="375.0" y="177.0" text-anchor="middle">evidence_seq per rule</text><rect class="node process" x="520" y="110" width="190" height="84" rx="12"/><text class="l" x="615.0" y="140.0" text-anchor="middle">write_copy</text><text class="s" x="615.0" y="160.0" text-anchor="middle">full JS file</text><text class="s" x="615.0" y="177.0" text-anchor="middle">banned-word check</text><rect class="node risk" x="760" y="110" width="200" height="84" rx="12"/><text class="l" x="860.0" y="140.0" text-anchor="middle">Score in sandbox</text><text class="s" x="860.0" y="160.0" text-anchor="middle">train % and held-out %</text><text class="s" x="860.0" y="177.0" text-anchor="middle">crash or timeout = 0%</text><rect class="node neutral" x="760" y="260" width="200" height="84" rx="12"/><text class="l" x="860.0" y="290.0" text-anchor="middle">Improved?</text><text class="s" x="860.0" y="310.0" text-anchor="middle">yes → keep this version</text><text class="s" x="860.0" y="327.0" text-anchor="middle">no → roll back to best</text><rect class="node process" x="400" y="260" width="250" height="84" rx="12"/><text class="l" x="525.0" y="290.0" text-anchor="middle">fix_copy</text><text class="s" x="525.0" y="310.0" text-anchor="middle">best code + first 20 mismatches</text><text class="s" x="525.0" y="327.0" text-anchor="middle">→ full new file</text><rect class="node good" x="40" y="260" width="300" height="120" rx="12"/><text class="l" x="190.0" y="291.0" text-anchor="middle">Stops when</text><text class="s" x="190.0" y="311.0" text-anchor="middle">train 100% and held-out passes</text><text class="s" x="190.0" y="328.0" text-anchor="middle">or 2 rounds without a gain</text><text class="s" x="190.0" y="345.0" text-anchor="middle">or round 4</text><text class="s" x="190.0" y="362.0" text-anchor="middle">best version → twin page</text><text class="s" x="40" y="430" text-anchor="start">After round 1 the brain re-reads all training lines, so new evidence becomes new rules.</text></svg>