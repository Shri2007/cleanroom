<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" role="img" aria-label="architecture">
<style>
  .bg{fill:#f8fafc} .fg{fill:#172033} .t{font:650 20px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172033}
  .l{font:600 14px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172033}
  .s{font:400 12px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#5b6475}
  .m{font:500 13px ui-monospace,Menlo,monospace;fill:#172033;white-space:pre}
  .node{stroke:#64748b;stroke-width:1}
  .neutral{fill:#e2e8f0} .input{fill:#bfdbfe} .process{fill:#c7d2fe} .storage{fill:#99f6e4}
  .external{fill:#fde68a} .risk{fill:#fecaca} .good{fill:#bbf7d0}
  .edge{stroke:#64748b;stroke-width:1.5;fill:none} .dash{stroke-dasharray:5 4}
  .zone{fill:none;stroke:#64748b;stroke-width:1;stroke-dasharray:6 5;opacity:.8}
  .arrow{fill:#64748b}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0f172a} .fg,.t,.l,.m{fill:#e5e7eb} .s{fill:#a3adbd}
    .node{stroke:#94a3b8} .edge{stroke:#94a3b8} .zone{stroke:#94a3b8} .arrow{fill:#94a3b8}
    .neutral{fill:#334155} .input{fill:#1d4ed8} .process{fill:#4338ca} .storage{fill:#0f766e}
    .external{fill:#92400e} .risk{fill:#991b1b} .good{fill:#166534}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path class="arrow" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="1120" height="560" rx="18"/><path class="edge" d="M174.0,196 L174.0,220" marker-end="url(#a)"/><path class="edge" d="M174.0,292 L174.0,306" marker-end="url(#a)"/><path class="edge" d="M304,338.0 C330,338 330,154 360,154.0" marker-end="url(#a)"/><path class="edge" d="M560,154.0 L590,154.0" marker-end="url(#a)"/><path class="edge" d="M690.0,196 L690.0,230" marker-end="url(#a)"/><path class="edge" d="M790,272.0 C820,272 820,158 846,158.0" marker-end="url(#a)"/><path class="edge" d="M961.0,204 L961.0,230" marker-end="url(#a)"/><path class="edge" d="M886,314 C886,350 460,350 460.0,314" marker-end="url(#a)"/><text class="s" x="680" y="345" text-anchor="middle">mismatches</text><path class="edge" d="M560,272.0 L590,272.0" marker-end="url(#a)"/><path class="edge dash" d="M961,314 L961,400 L265,400 L265,420" marker-end="url(#a)"/><path class="edge dash" d="M560,400 L560,420" marker-end="url(#a)"/><path class="edge dash" d="M855,400 L855,420" marker-end="url(#a)"/><text class="t" x="28" y="40">How Clean Room works</text><text class="s" x="28" y="62">It never sees the source. It watches the running program, writes rules, writes a copy, and proves it.</text><rect class="zone" x="826" y="84" width="270" height="300" rx="16"/><text class="s" x="840" y="104">3 · Prove</text><rect class="zone" x="340" y="84" width="470" height="300" rx="16"/><text class="s" x="354" y="104">2 · Learn (Meta muse-spark-1.3)</text><rect class="zone" x="24" y="84" width="300" height="300" rx="16"/><text class="s" x="38" y="104">1 · Observe</text><rect class="node external" x="44" y="112" width="260" height="84" rx="12"/><text class="l" x="174.0" y="142.0" text-anchor="middle">Real app (black box)</text><text class="s" x="174.0" y="162.0" text-anchor="middle">phone calculator via iPhone Mirroring</text><text class="s" x="174.0" y="179.0" text-anchor="middle">or the 1970s Unix cal program</text><rect class="node input" x="44" y="220" width="260" height="72" rx="12"/><text class="l" x="174.0" y="252.5" text-anchor="middle">Watch mode / tap</text><text class="s" x="174.0" y="272.5" text-anchor="middle">screenshot every 0.12 s, settle, queue</text><rect class="node process" x="44" y="306" width="260" height="64" rx="12"/><text class="l" x="174.0" y="334.5" text-anchor="middle">Meta reader</text><text class="s" x="174.0" y="354.5" text-anchor="middle">screen → {display, expression, op}</text><rect class="node storage" x="360" y="112" width="200" height="84" rx="12"/><text class="l" x="460.0" y="142.0" text-anchor="middle">Trace (JSONL)</text><text class="s" x="460.0" y="162.0" text-anchor="middle">every observed press</text><text class="s" x="460.0" y="179.0" text-anchor="middle">suspect + undo flags</text><rect class="node process" x="590" y="112" width="200" height="84" rx="12"/><text class="l" x="690.0" y="142.0" text-anchor="middle">Rules</text><text class="s" x="690.0" y="162.0" text-anchor="middle">✓ seen (with evidence)</text><text class="s" x="690.0" y="179.0" text-anchor="middle">? guessed (hypothesis)</text><rect class="node process" x="590" y="230" width="200" height="84" rx="12"/><text class="l" x="690.0" y="260.0" text-anchor="middle">Copy vN</text><text class="s" x="690.0" y="280.0" text-anchor="middle">plain JavaScript</text><text class="s" x="690.0" y="297.0" text-anchor="middle">Calc.press / render</text><rect class="node process" x="360" y="230" width="200" height="84" rx="12"/><text class="l" x="460.0" y="260.0" text-anchor="middle">Fix</text><text class="s" x="460.0" y="280.0" text-anchor="middle">mismatches → new version</text><text class="s" x="460.0" y="297.0" text-anchor="middle">kept only if it improves</text><rect class="node risk" x="846" y="112" width="230" height="92" rx="12"/><text class="l" x="961.0" y="146.0" text-anchor="middle">Node sandbox</text><text class="s" x="961.0" y="166.0" text-anchor="middle">--permission, PATH-only env</text><text class="s" x="961.0" y="183.0" text-anchor="middle">train + held-out tests</text><rect class="node good" x="846" y="230" width="230" height="84" rx="12"/><text class="l" x="961.0" y="260.0" text-anchor="middle">Score</text><text class="s" x="961.0" y="280.0" text-anchor="middle">% on its own tests</text><text class="s" x="961.0" y="297.0" text-anchor="middle">% on tests it never saw</text><rect class="node neutral" x="140" y="420" width="250" height="84" rx="12"/><text class="l" x="265.0" y="450.0" text-anchor="middle">Big screen</text><text class="s" x="265.0" y="470.0" text-anchor="middle">live preview, trace, rules</text><text class="s" x="265.0" y="487.0" text-anchor="middle">score climbing v1 → vN</text><rect class="node neutral" x="435" y="420" width="250" height="84" rx="12"/><text class="l" x="560.0" y="450.0" text-anchor="middle">Twin page</text><text class="s" x="560.0" y="470.0" text-anchor="middle">"Which one is real?"</text><text class="s" x="560.0" y="487.0" text-anchor="middle">best copy in a phone shell</text><rect class="node good" x="730" y="420" width="250" height="84" rx="12"/><text class="l" x="855.0" y="450.0" text-anchor="middle">Modernize</text><text class="s" x="855.0" y="470.0" text-anchor="middle">rewrite clean, prove identical</text><text class="s" x="855.0" y="487.0" text-anchor="middle">press by press</text></svg>