<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" width="1080" height="500" role="img" aria-label="fetch-agents">
<style>
  .bg{fill:#f8fafc} .fg{fill:#172033} .t{font:650 20px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172033}
  .l{font:600 14px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172033}
  .s{font:400 12px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#5b6475}
  .m{font:500 13px ui-monospace,Menlo,monospace;fill:#172033;white-space:pre}
  .node{stroke:#64748b;stroke-width:1}
  .neutral{fill:#e2e8f0} .input{fill:#bfdbfe} .process{fill:#c7d2fe} .storage{fill:#99f6e4}
  .external{fill:#fde68a} .risk{fill:#fecaca} .good{fill:#bbf7d0}
  .edge{stroke:#64748b;stroke-width:1.5;fill:none} .dash{stroke-dasharray:5 4}
  .zone{fill:none;stroke:#64748b;stroke-width:1;stroke-dasharray:6 5;opacity:.8}
  .arrow{fill:#64748b}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0f172a} .fg,.t,.l,.m{fill:#e5e7eb} .s{fill:#a3adbd}
    .node{stroke:#94a3b8} .edge{stroke:#94a3b8} .zone{stroke:#94a3b8} .arrow{fill:#94a3b8}
    .neutral{fill:#334155} .input{fill:#1d4ed8} .process{fill:#4338ca} .storage{fill:#0f766e}
    .external{fill:#92400e} .risk{fill:#991b1b} .good{fill:#166534}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path class="arrow" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="1080" height="500" rx="18"/><path class="edge" d="M232,156.0 L300,156.0" marker-end="url(#a)"/><path class="edge" d="M530,156.0 L600,156.0" marker-end="url(#a)"/><text class="s" x="565" y="150" text-anchor="middle">1</text><path class="edge" d="M700.0,202 L700.0,250" marker-end="url(#a)"/><text class="s" x="735" y="230" text-anchor="middle">2 · train</text><path class="edge" d="M800,296.0 L860,296.0" marker-end="url(#a)"/><path class="edge" d="M955.0,250 C955,60 415,60 415.0,110" marker-end="url(#a)"/><text class="s" x="690" y="74" text-anchor="middle">4 · independent pass/fail</text><path class="edge dash" d="M415.0,202 L415.0,330" marker-end="url(#a)"/><text class="s" x="450" y="290" text-anchor="middle">snapshot</text><text class="t" x="28" y="40">Fetch.ai: the whole rebuild inside an ASI:One chat</text><text class="s" x="28" y="62">"rebuild cal" → four uAgents in one Bureau. The builder never sees the held-out dates.</text><rect class="zone" x="580" y="90" width="490" height="272" rx="16"/><text class="s" x="594" y="352">Bureau (local, 127.0.0.1)</text><rect class="node external" x="32" y="110" width="200" height="92" rx="12"/><text class="l" x="132.0" y="144.0" text-anchor="middle">ASI:One chat</text><text class="s" x="132.0" y="164.0" text-anchor="middle">rebuild cal · status</text><text class="s" x="132.0" y="181.0" text-anchor="middle">rules · score · tests</text><rect class="node process" x="300" y="110" width="230" height="92" rx="12"/><text class="l" x="415.0" y="144.0" text-anchor="middle">Coordinator</text><text class="s" x="415.0" y="164.0" text-anchor="middle">Chat Protocol + mailbox</text><text class="s" x="415.0" y="181.0" text-anchor="middle">allowlist, 10 msg/min, timeouts</text><rect class="node input" x="600" y="110" width="200" height="92" rx="12"/><text class="l" x="700.0" y="144.0" text-anchor="middle">Explorer</text><text class="s" x="700.0" y="164.0" text-anchor="middle">runs /usr/bin/cal</text><text class="s" x="700.0" y="181.0" text-anchor="middle">30 public months</text><rect class="node process" x="600" y="250" width="200" height="92" rx="12"/><text class="l" x="700.0" y="284.0" text-anchor="middle">Builder</text><text class="s" x="700.0" y="304.0" text-anchor="middle">Meta run_cal</text><text class="s" x="700.0" y="321.0" text-anchor="middle">train rows only</text><rect class="node good" x="860" y="250" width="190" height="92" rx="12"/><text class="l" x="955.0" y="284.0" text-anchor="middle">Verifier</text><text class="s" x="955.0" y="304.0" text-anchor="middle">9 held-out dates</text><text class="s" x="955.0" y="321.0" text-anchor="middle">1700 · 1751 · 1753</text><rect class="node neutral" x="300" y="330" width="230" height="92" rx="12"/><text class="l" x="415.0" y="364.0" text-anchor="middle">Hosted agent</text><text class="s" x="415.0" y="384.0" text-anchor="middle">frozen real result</text><text class="s" x="415.0" y="401.0" text-anchor="middle">answers after 5 PM</text><text class="s" x="830" y="380" text-anchor="middle">3 · builder sends code only</text><text class="s" x="32" y="460" text-anchor="start">Measured in a real ASI:One chat: v4 100% train, verifier 9/9 held-out PASS, about 50 s end to end.</text></svg>