<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clean Room · Operator</title>
<style>
  :root {
    --bg: #0a0d11;
    --panel: #11161d;
    --panel-2: #151d26;
    --line: #222c38;
    --line-bright: #31404f;
    --ink: #e9eff7;
    --muted: #8794a5;
    --amber: #ffb04a;
    --mint: #45d483;
    --red: #ff5f57;
    --cyan: #5cc8d7;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    font-family: var(--sans);
    background:
      radial-gradient(900px 520px at 82% -8%, rgba(255, 176, 74, .10), transparent 62%),
      radial-gradient(760px 520px at 0% 108%, rgba(92, 200, 215, .07), transparent 58%),
      var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(255, 255, 255, .022) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, .022) 1px, transparent 1px);
    background-size: 48px 48px;
    -webkit-mask-image: radial-gradient(ellipse at 50% 18%, #000, transparent 76%);
    mask-image: radial-gradient(ellipse at 50% 18%, #000, transparent 76%);
  }
  button { font: inherit; }
  .shell {
    position: relative;
    z-index: 1;
    min-height: 100%;
    max-width: 1560px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
  }

  /* top bar */
  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 22px;
    border-bottom: 1px solid var(--line);
    background: rgba(10, 13, 17, .72);
    backdrop-filter: blur(8px);
  }
  .brand { display: flex; align-items: center; gap: 11px; }
  .mark {
    width: 28px;
    height: 28px;
    color: var(--amber);
    flex: 0 0 auto;
  }
  .brand h1 {
    margin: 0;
    font: 650 14px/1 var(--sans);
    letter-spacing: .2em;
    text-transform: uppercase;
  }
  .brand p {
    margin: 4px 0 0;
    font: 500 9.5px/1 var(--mono);
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .bar-right { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .session {
    max-width: 230px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font: 11px/1 var(--mono);
    color: var(--muted);
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 28px;
    padding: 0 11px;
    border: 1px solid var(--line);
    border-radius: 999px;
    font: 500 10px/1 var(--mono);
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .pill.online { color: var(--mint); border-color: rgba(69, 212, 131, .3); background: rgba(69, 212, 131, .06); }
  .pill.online i { background: var(--mint); box-shadow: 0 0 0 3px rgba(69, 212, 131, .13); }
  .pill.offline { color: var(--red); border-color: rgba(255, 95, 87, .35); background: rgba(255, 95, 87, .07); }
  .pill.offline i { background: var(--red); }
  .icon {
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    padding: 0;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
  }
  .icon:hover { color: var(--ink); border-color: var(--line-bright); }
  .icon svg { width: 16px; height: 16px; }
  .icon .off { display: none; }
  body.muted .icon .on { display: none; }
  body.muted .icon .off { display: block; }
  body.muted .icon { color: var(--red); }

  /* layout */
  .main {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) minmax(380px, .78fr);
    gap: 18px;
    padding: 16px 22px 20px;
  }
  .left, .right { display: flex; flex-direction: column; gap: 13px; min-height: 0; }

  /* live stage */
  .stage {
    position: relative;
    margin: 0;
    flex: 1;
    min-height: 300px;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: #05070a;
  }
  .stage img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #05070a;
  }
  .stage.captured { border-color: rgba(255, 176, 74, .45); }
  .brackets span {
    position: absolute;
    width: 22px;
    height: 22px;
    border-color: rgba(255, 176, 74, .55);
    border-style: solid;
    border-width: 0;
    pointer-events: none;
  }
  .brackets span:nth-child(1) { top: 12px; left: 12px; border-top-width: 1px; border-left-width: 1px; border-top-left-radius: 4px; }
  .brackets span:nth-child(2) { top: 12px; right: 12px; border-top-width: 1px; border-right-width: 1px; border-top-right-radius: 4px; }
  .brackets span:nth-child(3) { bottom: 12px; left: 12px; border-bottom-width: 1px; border-left-width: 1px; border-bottom-left-radius: 4px; }
  .brackets span:nth-child(4) { bottom: 12px; right: 12px; border-bottom-width: 1px; border-right-width: 1px; border-bottom-right-radius: 4px; }
  .stage-top {
    position: absolute;
    top: 14px;
    left: 16px;
    right: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    pointer-events: none;
  }
  .live {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 9px;
    border-radius: 6px;
    background: rgba(5, 7, 10, .62);
    font: 600 10px/1 var(--mono);
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #ffd6d3;
  }
  .live i {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--red);
    animation: pulse 2s ease-in-out infinite;
  }
  .count {
    padding: 5px 9px;
    border-radius: 6px;
    background: rgba(5, 7, 10, .62);
    font: 500 10px/1 var(--mono);
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .nosignal {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    gap: 6px;
    text-align: center;
    background: rgba(5, 7, 10, .55);
  }
  .nosignal[hidden] { display: none; }
  .nosignal b { font: 600 12px/1 var(--mono); letter-spacing: .24em; text-transform: uppercase; color: var(--red); }
  .nosignal span { font: 11px/1.4 var(--mono); color: var(--muted); }
  .stage-foot {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 26px 16px 12px;
    background: linear-gradient(transparent, rgba(5, 7, 10, .88));
    pointer-events: none;
  }
  .phase {
    font: 600 10px/1 var(--mono);
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--mint);
  }
  .stage.busy .phase { color: var(--amber); }
  .phase-hint { font: 10px/1 var(--mono); color: rgba(135, 148, 165, .8); }
  .settle {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 2px;
    background: rgba(255, 255, 255, .06);
  }
  .settle span {
    display: block;
    width: 0;
    height: 100%;
    background: var(--amber);
    transition: none;
  }
  .stage.busy .settle span { width: 100%; transition: width .25s linear; }

  /* capture strip */
  .strip {
    flex: 0 0 auto;
    height: 148px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 11px 13px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--panel);
  }
  .strip-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .strip-head h2, .readout-head h2 {
    margin: 0;
    font: 600 10px/1 var(--mono);
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .strip-head span { font: 10px/1 var(--mono); color: var(--muted); }
  .thumbs {
    display: flex;
    align-items: stretch;
    gap: 8px;
    min-height: 0;
    overflow-x: auto;
    overflow-y: hidden;
    padding-bottom: 2px;
    scrollbar-width: thin;
    scrollbar-color: var(--line-bright) transparent;
  }
  .thumbs::-webkit-scrollbar { height: 6px; }
  .thumbs::-webkit-scrollbar-thumb { background: var(--line-bright); border-radius: 3px; }
  .empty { margin: auto; font: 11px/1.4 var(--mono); color: rgba(135, 148, 165, .75); }
  .thumb {
    position: relative;
    flex: 0 0 auto;
    width: 104px;
    margin: 0;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: #080b0f;
    animation: in .22s ease-out;
  }
  .thumb img { display: block; width: 100%; height: 64px; object-fit: cover; }
  .thumb .noimg { height: 64px; background: repeating-linear-gradient(135deg, #10161e, #10161e 6px, #0c1218 6px, #0c1218 12px); }
  .thumb .cap {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 4px;
    padding: 4px 6px 5px;
    font: 500 10px/1.2 var(--mono);
    color: var(--muted);
  }
  .thumb .cap b { font-size: 11px; font-weight: 700; color: var(--ink); }
  .thumb .cap span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .thumb .s {
    position: absolute;
    top: 4px;
    left: 4px;
    padding: 1px 4px;
    border-radius: 4px;
    background: rgba(0, 0, 0, .68);
    font: 9px/1.4 var(--mono);
    color: #cfd8e3;
  }
  .thumb.suspect { border-color: rgba(255, 95, 87, .65); }
  .thumb.suspect::before {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    border-width: 0 14px 14px 0;
    border-style: solid;
    border-color: transparent var(--red) transparent transparent;
  }
  .thumb.deleted { opacity: .42; }
  .thumb.deleted::after {
    content: "UNDONE";
    position: absolute;
    inset: 0 0 26px;
    display: grid;
    place-items: center;
    font: 700 9px/1 var(--mono);
    letter-spacing: .16em;
    color: #fff;
    background: rgba(10, 13, 17, .55);
  }

  /* readout */
  .readout {
    flex: 0 0 auto;
    padding: 13px 15px 12px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
  }
  .readout-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .key-chip {
    min-width: 28px;
    padding: 3px 7px;
    border: 1px solid var(--line-bright);
    border-radius: 6px;
    text-align: center;
    font: 600 12px/1.3 var(--mono);
    color: var(--amber);
  }
  .display {
    margin: 8px 0 0;
    font: 600 clamp(34px, 4.4vw, 52px)/1 var(--mono);
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
    overflow: hidden;
  }
  .expr { margin: 4px 0 0; font: 12px/1.2 var(--mono); color: var(--muted); }
  .expr[hidden] { display: none; }
  .readout-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 9px; }
  .tag {
    padding: 3px 7px;
    border: 1px solid var(--line);
    border-radius: 5px;
    font: 500 9.5px/1.3 var(--mono);
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }
  .tag.bad { color: #ffd0cd; border-color: rgba(255, 95, 87, .45); background: rgba(255, 95, 87, .1); }
  .tag[hidden] { display: none; }

  /* keypad */
  .pad {
    flex: 1 1 auto;
    min-height: 0;
    max-height: 470px;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    grid-template-rows: repeat(5, minmax(44px, 1fr)) minmax(46px, .9fr);
    gap: 8px;
  }
  .k {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    color: var(--ink);
    background: linear-gradient(180deg, #1b2430, #161d26);
    border: 1px solid var(--line);
    border-radius: 12px;
    font: 600 21px/1 var(--mono);
    cursor: pointer;
    user-select: none;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04), 0 2px 8px rgba(0, 0, 0, .3);
    transition: background .12s ease, border-color .12s ease, transform .06s ease;
  }
  .k:hover:not(:disabled) { background: #1f2a37; border-color: var(--line-bright); }
  .k:active:not(:disabled) { transform: translateY(1px); background: #2a3746; }
  .k:disabled { opacity: .42; cursor: not-allowed; }
  .k.fn { font-size: 15px; color: #c7d3e1; background: #141b24; }
  .k.fn[data-key="AC"] { color: #ffbeb8; }
  .k.op { font-size: 23px; color: var(--amber); background: #1a2028; }
  .k.eq {
    grid-column: span 4;
    color: #191006;
    background: linear-gradient(180deg, #ffc472, #ef9f35);
    border-color: #f7b45c;
    font-size: 23px;
  }
  .k.eq:hover:not(:disabled) { background: #ffcd85; }
  .k.eq:active:not(:disabled) { background: #e5932c; }
  .k:focus-visible, .btn:focus-visible, .icon:focus-visible {
    outline: 2px solid var(--cyan);
    outline-offset: 2px;
  }

  /* actions */
  .actions { display: grid; grid-template-columns: 1.55fr 1fr; gap: 9px; margin-top: auto; }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    height: 56px;
    padding: 0 14px;
    border-radius: 12px;
    font: 700 12px/1 var(--sans);
    letter-spacing: .14em;
    text-transform: uppercase;
    cursor: pointer;
    transition: filter .12s ease, border-color .12s ease, transform .06s ease;
  }
  .btn svg { width: 19px; height: 19px; flex: 0 0 auto; }
  .btn small {
    display: block;
    margin-top: 4px;
    font: 500 8.5px/1 var(--mono);
    letter-spacing: .12em;
    opacity: .62;
  }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .snap {
    color: #191006;
    background: linear-gradient(180deg, #ffc472, #ef9f35);
    border: 1px solid #f7b45c;
  }
  .snap:hover:not(:disabled) { filter: brightness(1.05); }
  .undo { color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); }
  .undo:hover:not(:disabled) { border-color: var(--line-bright); background: #1b2430; }
  .hint {
    margin: 0;
    text-align: center;
    font: 9.5px/1.4 var(--mono);
    letter-spacing: .05em;
    color: rgba(135, 148, 165, .7);
  }

  /* flash + toast + motion */
  .flash {
    position: fixed;
    inset: 0;
    z-index: 60;
    /* soft, dim edge glow instead of a bright flash: safe for photosensitive viewers */
    box-shadow: inset 0 0 70px 8px rgba(124, 140, 255, .22);
    opacity: 0;
    pointer-events: none;
  }
  .flash.go { animation: flash .8s ease-out; }
  @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .flash.go { animation: none; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 22px;
    z-index: 70;
    transform: translate(-50%, 12px);
    max-width: min(520px, 90vw);
    padding: 10px 14px;
    border: 1px solid var(--line-bright);
    border-radius: 9px;
    background: #0d1218;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
    font: 11px/1.4 var(--mono);
    color: var(--ink);
    opacity: 0;
    pointer-events: none;
    transition: opacity .16s ease, transform .16s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 1000px) {
    .main { grid-template-columns: 1fr; padding: 12px 14px 16px; }
    .stage { flex: 0 0 auto; min-height: 0; aspect-ratio: 4 / 3; }
    .strip { height: auto; min-height: 132px; }
    .pad { max-height: none; grid-auto-rows: minmax(52px, auto); }
    .bar { padding: 10px 14px; }
    .session { display: none; }
    .actions { margin-top: 4px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>
<div class="flash" id="flash" aria-hidden="true"></div>

<div class="shell">
  <header class="bar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16" />
        <circle cx="12" cy="12" r="3.4" />
      </svg>
      <div>
        <h1>Clean Room</h1>
        <p>Operator console</p>
      </div>
    </div>
    <div class="bar-right">
      <span class="session" id="session" title="Trace file">no session</span>
      <span class="pill" id="link" role="status" title="Trace event stream"><i></i><span id="linkText">Connecting</span></span>
      <button class="icon" id="sound" type="button" aria-pressed="true" aria-label="Mute sound" title="Mute sound">
        <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <path d="M4 9.5v5h3.2L12 18.5v-13L7.2 9.5H4Z" />
          <path d="M15.5 8.5a4.6 4.6 0 0 1 0 7M18 6a8 8 0 0 1 0 12" />
        </svg>
        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <path d="M4 9.5v5h3.2L12 18.5v-13L7.2 9.5H4Z" />
          <path d="m16 9.5 5 5M21 9.5l-5 5" />
        </svg>
      </button>
    </div>
  </header>

  <main class="main">
    <section class="left">
      <figure class="stage" id="stage">
        <img id="preview" src="/preview.mjpg" alt="Live camera view of the calculator" />
        <div class="brackets" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        <div class="stage-top">
          <span class="live"><i></i>Live</span>
          <span class="count" id="count">0 lines</span>
        </div>
        <div class="nosignal" id="nosignal" hidden>
          <b>No signal</b>
          <span>waiting for the camera</span>
        </div>
        <div class="stage-foot">
          <span class="phase" id="settleLabel">Ready</span>
          <span class="phase-hint">Capture → AI read</span>
        </div>
        <div class="settle" aria-hidden="true"><span></span></div>
      </figure>

      <section class="strip" aria-label="Captures">
        <div class="strip-head">
          <h2>Captures</h2>
          <span id="stripCount">0</span>
        </div>
        <div class="thumbs" id="thumbs">
          <p class="empty" id="empty">No captures yet — tap a key.</p>
        </div>
      </section>
    </section>

    <section class="right">
      <section class="readout" aria-live="polite" aria-label="Last reading">
        <div class="readout-head">
          <h2>Last read</h2>
          <span class="key-chip" id="lastKey">—</span>
        </div>
        <p class="display" id="display">—</p>
        <p class="expr" id="expression" hidden></p>
        <div class="readout-foot">
          <span class="tag" id="model">—</span>
          <span class="tag" id="seqTag">seq —</span>
          <span class="tag bad" id="suspect" hidden>Suspect</span>
          <span class="tag" id="deletedTag" hidden>Undone</span>
        </div>
      </section>

      <section class="pad" id="keypad" aria-label="Calculator keypad">
        <button class="k fn" type="button" data-key="AC">AC</button>
        <button class="k fn" type="button" data-key="C">C</button>
        <button class="k fn" type="button" data-key="⌫" aria-label="Backspace">⌫</button>
        <button class="k op" type="button" data-key="÷" aria-label="Divide">÷</button>

        <button class="k" type="button" data-key="7">7</button>
        <button class="k" type="button" data-key="8">8</button>
        <button class="k" type="button" data-key="9">9</button>
        <button class="k op" type="button" data-key="×" aria-label="Multiply">×</button>

        <button class="k" type="button" data-key="4">4</button>
        <button class="k" type="button" data-key="5">5</button>
        <button class="k" type="button" data-key="6">6</button>
        <button class="k op" type="button" data-key="-" aria-label="Subtract">−</button>

        <button class="k" type="button" data-key="1">1</button>
        <button class="k" type="button" data-key="2">2</button>
        <button class="k" type="button" data-key="3">3</button>
        <button class="k op" type="button" data-key="+" aria-label="Add">+</button>

        <button class="k" type="button" data-key="%">%</button>
        <button class="k fn" type="button" data-key="+/-" aria-label="Plus minus">+/−</button>
        <button class="k" type="button" data-key="0">0</button>
        <button class="k" type="button" data-key="." aria-label="Decimal point">.</button>

        <button class="k eq" type="button" data-key="=" aria-label="Equals">=</button>
      </section>

      <div class="actions">
        <button class="btn snap" id="snap" type="button" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M3.5 8.5h3l1.4-2h8.2l1.4 2h3v9h-17v-9Z" />
            <circle cx="12" cy="12.8" r="3.1" />
          </svg>
          <span>Snap<small>re-read display</small></span>
        </button>
        <button class="btn undo" id="undo" type="button" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M9 7 4 12l5 5" />
            <path d="M4.5 12H14a5.5 5.5 0 0 1 5.5 5.5V19" />
          </svg>
          <span>Undo</span>
        </button>
      </div>
      <p class="hint">0–9 type · Enter = · Esc AC · S snap · U undo</p>
    </section>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const keypad = $("keypad");
  const thumbs = $("thumbs");
  const stage = $("stage");
  const preview = $("preview");

  const state = { busy: false, lines: 0, deleted: 0, lastSeq: 0, lastModel: "—", muted: readMuted(), connected: false };
  const undone = new Set();
  let phaseTimer = 0;
  let toastTimer = 0;

  /* ---------- sound ---------- */
  let ctx = null;

  function readMuted() {
    try { return localStorage.getItem("cleanroom.muted") === "1"; } catch { return false; }
  }

  function audio() {
    if (state.muted) return null;
    if (!ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return null;
      try { ctx = new AudioCtx(); } catch { return null; }
    }
    if (ctx.state === "suspended") ctx.resume().catch(() => {});
    return ctx;
  }

  function tone(freq, duration, type = "sine", gain = 0.04, delay = 0) {
    const ac = audio();
    if (!ac) return;
    const start = ac.currentTime + delay;
    const osc = ac.createOscillator();
    const amp = ac.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, start);
    amp.gain.setValueAtTime(0.0001, start);
    amp.gain.exponentialRampToValueAtTime(gain, start + 0.012);
    amp.gain.exponentialRampToValueAtTime(0.0001, start + duration);
    osc.connect(amp).connect(ac.destination);
    osc.start(start);
    osc.stop(start + duration + 0.03);
  }

  const sfx = {
    tap: () => tone(1480, 0.03, "square", 0.016),
    ok: () => { tone(880, 0.09, "sine", 0.035); tone(1320, 0.12, "sine", 0.03, 0.07); },
    suspect: () => { tone(220, 0.15, "sawtooth", 0.04); tone(170, 0.18, "sawtooth", 0.035, 0.1); },
    error: () => tone(140, 0.2, "square", 0.035)
  };

  function applyMute() {
    document.body.classList.toggle("muted", state.muted);
    const button = $("sound");
    button.setAttribute("aria-pressed", String(!state.muted));
    const label = state.muted ? "Unmute sound" : "Mute sound";
    button.setAttribute("aria-label", label);
    button.title = label;
  }

  $("sound").addEventListener("click", () => {
    state.muted = !state.muted;
    try { localStorage.setItem("cleanroom.muted", state.muted ? "1" : "0"); } catch {}
    applyMute();
    if (!state.muted) sfx.tap();
  });

  /* ---------- chrome ---------- */
  function setLink(ok) {
    state.connected = ok;
    $("link").className = "pill " + (ok ? "online" : "offline");
    $("linkText").textContent = ok ? "Linked" : "Offline";
  }

  function toast(message) {
    const el = $("toast");
    el.textContent = message;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2800);
  }

  let lastFlash = 0;
  function flash() {
    const now = performance.now();
    if (now - lastFlash < 1000) return;  // at most one cue per second
    lastFlash = now;
    const el = $("flash");
    el.classList.remove("go");
    void el.offsetWidth;
    el.classList.add("go");
  }

  function prettyKey(key) {
    return key === "+/-" ? "+/−" : key;
  }

  function available() {
    return Math.max(0, state.lines - state.deleted);
  }

  function setCount(total, deleted) {
    state.lines = total;
    state.deleted = deleted || 0;
    const plural = total === 1 ? "line" : "lines";
    $("count").textContent = total + " " + plural;
    $("stripCount").textContent = String(thumbs.querySelectorAll(".thumb").length);
    updateActions();
  }

  function updateActions() {
    const off = state.busy || available() === 0;
    $("snap").disabled = off;
    $("undo").disabled = off;
  }

  function setBusy(busy, phase) {
    state.busy = busy;
    stage.classList.toggle("busy", busy);
    for (const button of keypad.querySelectorAll("button")) button.disabled = busy;
    $("settleLabel").textContent = busy ? (phase || "Settling") : "Ready";
    clearTimeout(phaseTimer);
    if (busy) {
      phaseTimer = setTimeout(() => {
        if (state.busy) $("settleLabel").textContent = "Reading";
      }, 680);
    }
    updateActions();
  }

  function renderReadout(line, model) {
    state.lastSeq = line.seq;
    $("display").textContent = line.display === null || line.display === undefined ? "—" : line.display;
    const expr = $("expression");
    expr.textContent = line.expression || "";
    expr.hidden = !line.expression;
    $("lastKey").textContent = prettyKey(line.key);
    $("model").textContent = model || "—";
    $("seqTag").textContent = "seq " + line.seq + " · test " + line.test;
    $("suspect").hidden = !line.suspect;
    $("deletedTag").hidden = !line.deleted;
  }

  function addThumb(thumb, line) {
    const card = document.createElement("figure");
    card.className = "thumb" + (line.suspect ? " suspect" : "") + (line.deleted ? " deleted" : "");
    card.dataset.seq = String(line.seq);

    if (thumb) {
      const img = document.createElement("img");
      img.src = "data:image/jpeg;base64," + thumb;
      img.alt = "Capture of the display after " + prettyKey(line.key);
      card.appendChild(img);
    } else {
      const blank = document.createElement("div");
      blank.className = "noimg";
      card.appendChild(blank);
    }

    const seq = document.createElement("span");
    seq.className = "s";
    seq.textContent = "#" + line.seq;

    const cap = document.createElement("figcaption");
    cap.className = "cap";
    const key = document.createElement("b");
    key.textContent = prettyKey(line.key);
    const value = document.createElement("span");
    value.textContent = line.display === null || line.display === undefined ? "—" : line.display;
    cap.append(key, value);
    card.append(seq, cap);

    const empty = $("empty");
    if (empty) empty.remove();
    thumbs.appendChild(card);
    while (thumbs.querySelectorAll(".thumb").length > 24) thumbs.querySelector(".thumb").remove();
    thumbs.scrollLeft = thumbs.scrollWidth;
    $("stripCount").textContent = String(thumbs.querySelectorAll(".thumb").length);
  }

  function markUndone(line) {
    if (undone.has(line.seq)) return;
    undone.add(line.seq);
    const card = thumbs.querySelector('[data-seq="' + line.seq + '"]');
    if (card) card.classList.add("deleted");
    state.deleted += 1;
    if (line.seq === state.lastSeq) $("deletedTag").hidden = false;
    setCount(state.lines, state.deleted);
  }

  function resetView() {
    for (const card of thumbs.querySelectorAll(".thumb")) card.remove();
    if (!$("empty")) {
      const p = document.createElement("p");
      p.className = "empty";
      p.id = "empty";
      p.textContent = "No captures yet — tap a key.";
      thumbs.appendChild(p);
    }
    undone.clear();
    state.lastSeq = 0;
    $("display").textContent = "—";
    $("expression").hidden = true;
    $("lastKey").textContent = "—";
    $("model").textContent = "—";
    $("seqTag").textContent = "seq —";
    $("suspect").hidden = true;
    $("deletedTag").hidden = true;
    setCount(0, 0);
  }

  /* ---------- API ---------- */
  async function post(path, payload) {
    const response = await fetch(path, {
      method: "POST",
      headers: payload ? { "Content-Type": "application/json" } : undefined,
      body: payload ? JSON.stringify(payload) : undefined
    });
    if (!response.ok) {
      let detail = response.status + " " + response.statusText;
      try {
        const body = await response.json();
        if (body && body.detail) detail = body.detail;
      } catch {}
      throw new Error(detail);
    }
    return response.json();
  }

  async function refreshState() {
    try {
      const response = await fetch("/trace", { cache: "no-store" });
      if (!response.ok) throw new Error("trace " + response.status);
      applyTrace(await response.json());
    } catch {
      setLink(false);
    }
  }

  function applyTrace(data) {
    const lines = Array.isArray(data.lines) ? data.lines : [];
    $("session").textContent = data.path || "no session";
    $("session").title = data.path || "Trace file";
    undone.clear();
    for (const line of lines) if (line.deleted) undone.add(line.seq);
    setCount(lines.length, lines.filter((line) => line.deleted).length);
    setBusy(Boolean(data.busy));
    const last = lines.filter((line) => !line.deleted).pop();
    if (last) renderReadout(last, last.seq === state.lastSeq ? state.lastModel : "—");
  }

  async function tap(key) {
    if (state.busy) return;
    sfx.tap();
    setBusy(true, "Settling");
    try {
      await post("/tap", { key });
    } catch (error) {
      sfx.error();
      toast(error.message || "Tap failed");
      await refreshState();
    }
  }

  async function snap() {
    if (state.busy || available() === 0) return;
    setBusy(true, "Settling");
    try {
      await post("/snap");
    } catch (error) {
      sfx.error();
      toast(error.message || "Snap failed");
      await refreshState();
    }
  }

  async function undo() {
    if (state.busy || available() === 0) return;
    try {
      const data = await post("/undo");
      markUndone(data.line);
      toast("Undone · seq " + data.line.seq);
    } catch (error) {
      sfx.error();
      toast(error.message || "Undo failed");
    }
  }

  /* ---------- events ---------- */
  $("keypad").addEventListener("click", (event) => {
    const button = event.target.closest("button[data-key]");
    if (!button) return;
    if (event.detail > 0) button.blur();
    tap(button.dataset.key);
  });
  $("snap").addEventListener("click", snap);
  $("undo").addEventListener("click", undo);

  window.addEventListener("keydown", (event) => {
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    const onButton = document.activeElement && document.activeElement.tagName === "BUTTON";
    if (onButton && (event.key === " " || event.key === "Enter")) return;

    const mapped = { "*": "×", "/": "÷", Enter: "=", Escape: "AC", Backspace: "⌫", Delete: "⌫" };
    const key = mapped[event.key] || event.key;
    if (key === "s" || key === "S") { event.preventDefault(); snap(); return; }
    if (key === "u" || key === "U") { event.preventDefault(); undo(); return; }
    const known = /^[0-9]$/.test(key) || [".", "+", "-", "%", "×", "÷", "=", "AC", "C", "⌫"].includes(key);
    if (known) {
      event.preventDefault();
      tap(key);
    }
  });

  const source = new EventSource("/events");
  source.onopen = () => setLink(true);
  source.onerror = () => setLink(false);

  source.addEventListener("state", (event) => {
    setLink(true);
    const data = JSON.parse(event.data);
    setCount(data.lines, state.deleted);
    setBusy(Boolean(data.busy));
  });

  source.addEventListener("snapshot", () => {
    flash();
    $("settleLabel").textContent = "Captured · reading";
  });

  source.addEventListener("capture", (event) => {
    const data = JSON.parse(event.data);
    const line = data.line;
    state.lastModel = data.model || "—";
    renderReadout(line, state.lastModel);
    addThumb(data.thumb, line);
    if (line.seq > state.lines) setCount(line.seq, state.deleted);
    if (!data.snapshot_shown) flash();
    if (line.suspect) sfx.suspect(); else sfx.ok();
    stage.classList.add("captured");
    setTimeout(() => stage.classList.remove("captured"), 340);
  });

  source.addEventListener("undo", (event) => {
    markUndone(JSON.parse(event.data).line);
  });

  source.addEventListener("session", (event) => {
    const data = JSON.parse(event.data);
    $("session").textContent = data.path || "no session";
    resetView();
    toast("New session · " + (data.path || ""));
  });

  /* ---------- preview watchdog ---------- */
  let previewTimer = 0;

  function watchPreview() {
    clearTimeout(previewTimer);
    if (preview.naturalWidth === 0) {
      $("nosignal").hidden = false;
      previewTimer = setTimeout(() => {
        preview.src = "/preview.mjpg?t=" + Date.now();
        watchPreview();
      }, 3000);
    }
  }

  preview.addEventListener("load", () => {
    $("nosignal").hidden = true;
    clearTimeout(previewTimer);
  });
  preview.addEventListener("error", () => {
    $("nosignal").hidden = false;
    clearTimeout(previewTimer);
    previewTimer = setTimeout(() => {
      preview.src = "/preview.mjpg?t=" + Date.now();
      watchPreview();
    }, 2500);
  });
  setTimeout(watchPreview, 4500);

  /* ---------- boot ---------- */
  applyMute();
  setLink(false);
  refreshState();
  setInterval(refreshState, 5000);
})();
</script>
</body>
</html>
